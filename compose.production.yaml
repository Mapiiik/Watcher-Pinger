# Watcher Pinger on a server of its own, answering on 80 and 443. Behind a proxy that passes TLS through with the
# PROXY header, HAProxy in TCP mode say, drop the ports, join the proxy's network under an alias and set
# PINGER_USE_PROXY_PROTOCOL and PINGER_PROXY_ALLOW_CIDRS; see the README.
services:
  watcher-pinger:
    image: ghcr.io/mapiiik/watcher-pinger:latest
    restart: unless-stopped
    stop_grace_period: 60s

    env_file:
      - .env

    volumes:
      # the ACME certificates, and the last network fetched from Watcher NMS for a start without it
      - pinger_certs:/app/certs/
      - pinger_data:/app/data/

    ports:
      - "80:80"
      - "443:443"

    # The server runs as a user of its own without any capability: the container lets it bind 80 and 443 and ping
    # over an unprivileged ICMP socket. A raw socket (PINGER_ICMP=raw) would need user: root and cap_add: NET_RAW.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
      net.ipv4.ping_group_range: "0 2147483647"

volumes:
  pinger_certs:
  pinger_data:
