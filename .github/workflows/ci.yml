name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # a version, bare as the other Watcher applications tag it: 1.0.0, 1.1.0-RC1
    tags:
      - '[0-9]*'

env:
  # The minor release only: every build takes its latest patch release (security fixes)
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: 'v2.15.0'

jobs:
  ##########################################################################
  # The program runs on Windows, the rest of the code anywhere: it is
  # linted for both and tested on Linux, the ICMP helper on Windows itself.
  ##########################################################################
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Go vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: GolangCI-Lint for Windows
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Go test
        run: go test -race ./...

  windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Go test
        run: go test ./...

  ##########################################################################
  # Every run keeps the program as an artifact; a tag publishes it as a
  # release too.
  ##########################################################################
  build:
    name: Build
    needs:
      - test
      - windows
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # the version is told by the tags
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Version
        id: version
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/watcher-pinger.exe ./src/main

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: watcher-pinger-${{ steps.version.outputs.version }}
          path: dist/watcher-pinger.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: watcher-pinger-${{ needs.build.outputs.version }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # a tag with a suffix, 1.1.0-RC1, is a prerelease
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" watcher-pinger.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Watcher Pinger $TAG" \
            --generate-notes \
            "${prerelease[@]}"
