name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # a version, bare as the other Watcher applications tag it: 1.0.0, 1.1.0-RC1
    tags:
      - '[0-9]*'

env:
  # The minor release only: every build takes its latest patch release (security fixes)
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: 'v2.15.0'

jobs:
  ##########################################################################
  # The program runs on Windows and the server on Linux: the code is linted
  # for both and tested on Linux, the ICMP helper on Windows itself.
  ##########################################################################
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Go vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: GolangCI-Lint for Windows
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Go test
        run: go test -race ./...

      # the raw socket of the server needs CAP_NET_RAW, which the tests above go without
      - name: Go test of the ICMP sockets
        run: |
          go test -c -race -o icmpsocket.test ./src/infra/icmpsocket
          sudo ./icmpsocket.test -test.v

  windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Go test
        run: go test ./...

  ##########################################################################
  # Every run keeps the program as an artifact; a tag publishes it as a
  # release too.
  ##########################################################################
  build:
    name: Build
    needs:
      - test
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the attestation of a release
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # the version is told by the tags
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Version
        id: version
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      # the version into the properties of the .exe: the number of the tag as the file version, 0.0.0.0 without one,
      # and the whole of it as the product version
      - name: Windows resource
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: src/desktop
        run: |
          number=$(echo "$VERSION" | grep -oE '^v?[0-9]+(\.[0-9]+){0,3}' | sed 's/^v//' || true)
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --out rsrc \
            --file-version "${number:-0.0.0.0}" --product-version "$VERSION"

      # a console program on both; on Windows its manifest gives it no console when started from Explorer
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/watcher-pinger.exe ./src/desktop
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/watcher-pinger ./src/desktop
          cd dist && sha256sum watcher-pinger.exe watcher-pinger > SHA256SUMS

      # a release says where its programs were built: gh attestation verify watcher-pinger.exe -R Mapiiik/Watcher-Pinger
      - name: Attest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/watcher-pinger.exe
            dist/watcher-pinger

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: watcher-pinger-${{ steps.version.outputs.version }}
          path: |
            dist/watcher-pinger.exe
            dist/watcher-pinger
            dist/SHA256SUMS
          if-no-files-found: error

  ##########################################################################
  # The server as an image: latest from main, the version and its major
  # number from a tag (a prerelease gets its version only).
  ##########################################################################
  docker:
    name: Docker image
    if: github.event_name != 'pull_request'
    needs:
      - test
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Go cross-compiles in the build stage and the runtime stage runs nothing, so arm64 needs no QEMU
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.production
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: watcher-pinger-${{ needs.build.outputs.version }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # a tag with a suffix, 1.1.0-RC1, is a prerelease
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" watcher-pinger.exe watcher-pinger SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Watcher Pinger $TAG" \
            --generate-notes \
            "${prerelease[@]}"
